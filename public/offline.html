<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Offline | SomniAI</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        color: #e8ecf6;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background:
          radial-gradient(1200px 600px at 80% -10%, rgba(99, 102, 241, 0.25), transparent),
          radial-gradient(900px 500px at -10% 20%, rgba(56, 189, 248, 0.18), transparent),
          #0b1020;
        text-align: center;
      }
      .card {
        max-width: 460px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
      }
      h1 { margin: 16px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 20px; color: #b6bfd6; line-height: 1.5; }
      .moon { width: 64px; height: 64px; }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 14px;
        background: #6366f1;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="moon" viewBox="0 0 512 512" aria-hidden="true">
        <path d="M330 300a118 118 0 1 1-118-160 92 92 0 0 0 118 160z" fill="#e8ecf6" />
      </svg>
      <h1>You're offline</h1>
      <p>
        SomniAI can't reach the network right now. Any alarms you already
        scheduled keep running locally - reconnect to sync your data and use AI
        features.
      </p>
      <a href="/" onclick="location.reload()">Try again</a>
    </main>
  </body>
</html>
