[pytest]
testpaths = tests
python_files = test_*.py
# Full-grid simulation studies take minutes and duplicate what
# `evaluation/run_study.py` reports. Deselected by default so the suite stays
# fast enough to actually run; the fast variants still assert every property.
#   full suite:  pytest -m ""
#   slow only:   pytest -m slow
addopts = -q -m "not slow"
markers =
    slow: exhaustive study over the full scenario x target grid
